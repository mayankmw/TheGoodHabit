<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E9B48A"/>
      <stop offset="0.6" stop-color="#DDA176"/>
      <stop offset="1" stop-color="#B97A52"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A486DD"/>
      <stop offset="0.6" stop-color="#8A68CC"/>
      <stop offset="1" stop-color="#6A4BAF"/>
    </linearGradient>
    <linearGradient id="pants" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4A5688"/>
      <stop offset="1" stop-color="#2F3866"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2C1C"/>
      <stop offset="1" stop-color="#2A170E"/>
    </linearGradient>
  </defs>

  <!-- arms: hands on hips, same loop as the date's -->
  <g fill="none" stroke="#3B1E14" stroke-width="11" stroke-linecap="round">
    <path d="M372 600 C 300 610, 290 690, 352 712"/>
    <path d="M628 600 C 700 610, 710 690, 648 712"/>
  </g>

  <!-- legs -->
  <g stroke="#3B1E14" stroke-width="11" stroke-linecap="round">
    <line x1="455" y1="800" x2="452" y2="862"/>
    <line x1="545" y1="800" x2="548" y2="862"/>
  </g>

  <!-- shoes -->
  <ellipse cx="420" cy="872" rx="58" ry="24" fill="#7A2E2A"/>
  <ellipse cx="580" cy="872" rx="58" ry="24" fill="#6A2522"/>
  <ellipse cx="408" cy="864" rx="30" ry="8" fill="#B5514A" opacity="0.7"/>
  <ellipse cx="568" cy="864" rx="30" ry="8" fill="#A0453F" opacity="0.6"/>

  <!-- shorts -->
  <path d="M372 730 L 628 730 L 622 806 Q 600 816 560 812 L 500 790 L 440 812 Q 400 816 378 806 Z" fill="url(#pants)"/>

  <!-- shirt -->
  <path d="M500 505 C 610 505, 650 560, 650 640 C 650 700, 640 740, 628 748 L 372 748 C 360 740, 350 700, 350 640 C 350 560, 390 505, 500 505 Z" fill="url(#shirt)"/>
  <path d="M398 560 C 372 600, 372 680, 384 728" fill="none" stroke="#C9B6EE" stroke-width="16" stroke-linecap="round" opacity="0.7"/>
  <!-- collar -->
  <path d="M452 512 L 500 560 L 548 512 Z" fill="#E9B48A"/>
  <path d="M440 510 L 500 568 L 470 584 Z M560 510 L 500 568 L 530 584 Z" fill="#F4EFFC"/>

  <!-- neck -->
  <rect x="470" y="490" width="60" height="30" rx="12" fill="#C98760"/>

  <!-- ears -->
  <ellipse cx="330" cy="340" rx="30" ry="42" fill="#DDA176"/>
  <ellipse cx="670" cy="340" rx="30" ry="42" fill="#B97A52"/>
  <ellipse cx="332" cy="340" rx="13" ry="22" fill="#C98760"/>
  <ellipse cx="668" cy="340" rx="13" ry="22" fill="#A56A45"/>

  <!-- head -->
  <ellipse cx="500" cy="330" rx="172" ry="185" fill="url(#skin)"/>
  <!-- gloss, like the date's left-side highlight -->
  <path d="M372 280 C 358 320, 360 370, 380 410" fill="none" stroke="#F8D6BA" stroke-width="14" stroke-linecap="round" opacity="0.5"/>
  <circle cx="392" cy="432" r="6" fill="#F8D6BA" opacity="0.5"/>

  <!-- hair -->
  <path d="M330 300 C 320 190, 400 130, 500 132 C 610 130, 690 190, 672 300 C 650 250, 610 228, 560 232 C 590 210, 600 190, 596 176 C 560 222, 470 236, 400 230 C 365 240, 342 262, 330 300 Z" fill="url(#hair)"/>
  <path d="M430 160 C 470 148, 520 146, 560 156" fill="none" stroke="#6B4630" stroke-width="10" stroke-linecap="round" opacity="0.8"/>

  <!-- eyebrows -->
  <g fill="none" stroke="#2A170E" stroke-width="12" stroke-linecap="round">
    <path d="M400 262 Q 432 248 462 260"/>
    <path d="M538 260 Q 568 248 600 262"/>
  </g>

  <!-- eyes -->
  <ellipse cx="432" cy="330" rx="50" ry="54" fill="#FFFFFF"/>
  <ellipse cx="568" cy="330" rx="50" ry="54" fill="#FFFFFF"/>
  <circle cx="446" cy="338" r="22" fill="#1E1210"/>
  <circle cx="582" cy="338" r="22" fill="#1E1210"/>
  <circle cx="454" cy="329" r="7" fill="#FFFFFF"/>
  <circle cx="590" cy="329" r="7" fill="#FFFFFF"/>

  <!-- smile -->
  <path d="M452 425 Q 500 462 548 425" fill="none" stroke="#3B1E14" stroke-width="13" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="398" cy="410" rx="22" ry="12" fill="#E58C77" opacity="0.45"/>
  <ellipse cx="602" cy="410" rx="22" ry="12" fill="#C9705E" opacity="0.4"/>
</svg>
